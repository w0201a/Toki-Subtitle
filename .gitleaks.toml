[extend]
useDefault = true

[[allowlists]]
description = "Public SHA-256 host cache fingerprint, generated by HostScanPlan and HostDexIndex.digest; not an authentication key"
condition = "AND"
paths = ['''^app/src/main/resources/toki-host-profiles/[a-f0-9]{64}\.properties$''']
regexTarget = "line"
regexes = ['''cache\.key=[a-f0-9]{64}\r?$''']
