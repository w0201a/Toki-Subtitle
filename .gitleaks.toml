[extend]
useDefault = true

[[allowlists]]
description = "Public SHA-256 host cache fingerprint, generated by HostScanPlan and HostDexIndex.digest; not an authentication key"
condition = "AND"
paths = ['''^app/src/main/resources/toki-host-profiles/[a-f0-9]{64}\.properties$''']
regexTarget = "line"
regexes = ['''cache\.key=[a-f0-9]{64}\r?$''']

[[allowlists]]
description = "SHA-256 structural hashes of four public Aweme field contracts, not API credentials"
condition = "AND"
paths = ['''^app/src/main/resources/toki-extension-profile\.properties$''']
regexTarget = "match"
regexes = ['''^(?:field\.)?(?:keySegmentsInfo|mCommerceVideoAuthInfo|promoteToastKey|surveyKey)=[a-f0-9]{64}$''']
