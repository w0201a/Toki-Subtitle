name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_release:
        description: Also build unsigned Release APK
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Verify and build Debug
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace --console=plain
      - name: Build and verify unified test APK
        shell: bash
        run: |
          API_AAR=$(find "$HOME/.gradle/caches/modules-2/files-2.1/io.github.libxposed/api/102.0.0" -name '*.aar' -print -quit)
          python3 scripts/prepare-lspatch.py "$API_AAR"
          ./gradlew :app:assembleLspatch -PtokiLegacy=true -PtokiOptimize=true --no-daemon --max-workers=1 --console=plain
          python3 scripts/verify-lspatch.py app/build/outputs/apk/lspatch/app-lspatch.apk
          mkdir -p app/build/universal-assets/toki
          cp app/build/outputs/apk/lspatch/app-lspatch.apk app/build/universal-assets/toki/legacy-payload.apk
          ./gradlew :app:assembleUniversal -PtokiOptimize=true --no-daemon --max-workers=1 --console=plain
          python3 scripts/verify-universal.py app/build/outputs/apk/universal/app-universal.apk
      - name: Build Release when explicitly requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        run: ./gradlew :app:assembleRelease --stacktrace --console=plain
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Toki-Subtitle-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/universal/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
