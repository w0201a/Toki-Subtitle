name: Feature request / 功能建议
description: Suggest a concrete improvement / 提出有明确使用场景的改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case / 使用场景
      description: Describe the problem and your TikTok version and download source. / 描述问题，注明 TikTok 版本及下载渠道。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 建议行为
      description: Explain how it should work and any alternatives you considered. / 说明预期效果和已考虑的替代方案。
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References / 参考资料
      description: Public links or redacted screenshots; no APKs or decompiled host code. / 可附公开链接或已遮挡隐私的截图，不上传 APK 或宿主反编译源码。
